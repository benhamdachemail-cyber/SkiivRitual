name: Build Windows VST3
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Compile VST3
        run: cmake --build build --config Release --target SkiivRitualSounds_VST3 --parallel 2
      - name: Package Windows VST3 bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build/SkiivRitualSounds_artefacts/Release/VST3 -Filter '*.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'No VST3 bundle found' }
          Compress-Archive -Path $bundle.FullName -DestinationPath Skiiv-Ritual-Sounds-Windows-VST3.zip -Force
      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: Skiiv-Ritual-Sounds-Windows-VST3
          path: Skiiv-Ritual-Sounds-Windows-VST3.zip
          if-no-files-found: error
